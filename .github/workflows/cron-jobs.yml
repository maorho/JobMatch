name: JobMatch Cron

on:
  schedule:
    - cron: "*/30 * * * *"    # Scout: ingest fresh ATS jobs (every 30 min, best-effort)
    - cron: "0 */6 * * *"     # sync-if-stale: every 6 hours (UTC)
    - cron: "0 */12 * * *"    # cleanup-now: every 12 hours (UTC)
    - cron: "0 6 * * *"       # job-match digest: daily 06:00 UTC (09:00 Israel)
    - cron: "15 */2 * * *"    # gmail application tracking: every 2 hours
  workflow_dispatch:

env:
  PROD_BASE_URL: https://job-match-six.vercel.app

# Serialize overlapping runs (e.g. when the */30, 6h and 12h schedules coincide)
# so ingestion/cleanup never run concurrently.
concurrency:
  group: jobmatch-cron
  cancel-in-progress: false

jobs:
  scout_run:
    # Only on the 30-min schedule (or manual dispatch) — not also on the 6h/12h
    # ticks. embed_jobs `needs` this, so it follows the same gate.
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call scout/run (chunked until the whole catalog is covered)
        shell: bash
        run: |
          # Each call polls sources for up to ~4 minutes and returns
          # `nextOffset`; loop until it is null so a serverless timeout can
          # never leave the tail of the catalog unpolled.
          offset=0
          for i in $(seq 1 30); do
            resp=$(curl -fsS -G "${{ env.PROD_BASE_URL }}/api/scout/run" \
              --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}" \
              --data-urlencode "offset=$offset" \
              --data-urlencode "limit=25" \
              --data-urlencode "budget=240")
            echo "$resp" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s);
                console.log(`chunk offset=${j.nextOffset===null?"last":""} processed=${j.processed}/${j.totalSources} created=${j.created} removed=${j.removed}`);
                const errs=(j.results||[]).filter(r=>r.error);
                if(errs.length) console.log("source errors:", errs.map(r=>r.company+": "+r.error).join(" | "));
              });'
            next=$(echo "$resp" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.nextOffset===null?"":String(j.nextOffset));})')
            [ -z "$next" ] && { echo "scout: catalog fully covered"; break; }
            offset=$next
          done

  normalize_locations:
    # Location agent: resolve any new raw location strings (cache → rules →
    # LLM) so filters/facets stay canonical. Idempotent.
    needs: scout_run
    runs-on: ubuntu-latest
    steps:
      - name: Call scout/normalize-locations
        shell: bash
        run: |
          curl -fsS -G "${{ env.PROD_BASE_URL }}/api/scout/normalize-locations" \
            --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}"

  embed_jobs:
    # Embed newly-ingested jobs for the Matcher, after the Scout runs.
    needs: scout_run
    runs-on: ubuntu-latest
    steps:
      - name: Call matcher/embed-jobs
        shell: bash
        run: |
          curl -fsS -G "${{ env.PROD_BASE_URL }}/api/matcher/embed-jobs" \
            --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}"

  sync_if_stale:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-if-stale
        shell: bash
        run: |
          curl -fsS -G "${{ env.PROD_BASE_URL }}/api/external-jobs/sync-if-stale" \
            --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}"

  job_match_digest:
    # Notify each user with a résumé about new postings that match them.
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call notifications/job-matches
        shell: bash
        run: |
          curl -fsS -G "${{ env.PROD_BASE_URL }}/api/notifications/job-matches" \
            --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}"

  gmail_sync:
    # Read connected mailboxes and update application statuses from emails.
    if: github.event.schedule == '15 */2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call integrations/gmail/sync
        shell: bash
        run: |
          curl -fsS -G "${{ env.PROD_BASE_URL }}/api/integrations/gmail/sync" \
            --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}"

  cleanup_now:
    if: github.event.schedule == '0 */12 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup-now
        shell: bash
        run: |
          curl -fsS -G "${{ env.PROD_BASE_URL }}/api/external-jobs/cleanup-now" \
            --data-urlencode "cron_secret=${{ secrets.CRON_SECRET }}"
