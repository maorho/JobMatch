name: Apply server image

# Builds the Puppeteer apply server (jobsearch/server) into a container,
# smoke-tests it (health + a real Chrome page load), and publishes it to
# GitHub's registry as ghcr.io/maorho/jobmatch-apply:latest. A container
# host (Render, Koyeb, Cloud Run, Fly, Railway) pulls that image; see
# jobsearch/DEPLOY.md §4.

on:
  push:
    branches: [main]
    paths:
      - "jobsearch/server/**"
      - "jobsearch/package.json"
      - "jobsearch/package-lock.json"
      - "jobsearch/.dockerignore"
      - "jobsearch/Dockerfile"
      - ".github/workflows/apply-server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: apply-server-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jobmatch-apply
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: jobsearch
          file: jobsearch/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — health, then a real page through Chrome
        shell: bash
        run: |
          set -uo pipefail
          docker run -d --name apply -p 4000:4000 -e SCRAPER_TOKEN=smoke-token -e SCRAPER_CONCURRENCY=1 ${{ env.IMAGE }}:test
          up=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then echo "::error::server never answered /health"; docker logs apply; exit 1; fi
          echo "health: $(curl -s http://127.0.0.1:4000/health)"
          # /api/open-job launches Chrome and renders the page. It answers 200 with
          # {finalUrl, jobdescription} (both null on a non-job page like example.com)
          # and 500 when Chrome failed, so the status code is the proof we need.
          code=$(curl -s -o /tmp/open.json -w "%{http_code}" --max-time 120 -H "x-scraper-token: smoke-token" "http://127.0.0.1:4000/api/open-job?url=https%3A%2F%2Fexample.com%2F")
          echo "open-job: HTTP $code $(head -c 300 /tmp/open.json)"
          if [ "$code" != "200" ] || ! grep -q '"jobdescription"' /tmp/open.json; then
            echo "::error::Chrome did not render the page (HTTP $code)"; docker logs apply; exit 1
          fi
          docker logs apply | tail -20
          docker rm -f apply

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: jobsearch
          file: jobsearch/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
